services:
  relieffm-mini:
    build:
      context: ..
      dockerfile: infra/gcp/Dockerfile
    environment:
      RELIEFFM_CHECKPOINT_DIR: /models/checkpoint
      RELIEFFM_DEVICE: cpu
    volumes:
      - ${RELIEFFM_CHECKPOINT_HOST_DIR:?set RELIEFFM_CHECKPOINT_HOST_DIR}:/models/checkpoint:ro
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          assert json.load(urllib.request.urlopen("http://127.0.0.1:8080/model/v1/health"))["status"] == "ok"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
