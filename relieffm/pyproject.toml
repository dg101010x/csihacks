[project]
name = "relieffm"
version = "0.1.0"
description = "ReliefFM: obligation-aware financial event model (Plan One workstream)"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5",
  "accelerate>=0.30",
  "pydantic>=2.6",
  "pyarrow>=15.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "safetensors>=0.4",
  "fastapi>=0.110",
  "httpx>=0.27",
  "uvicorn[standard]>=0.29",
  "pyyaml>=6.0",
  "pytest>=8.0",
  "tqdm>=4.66",
]

[tool.setuptools]
packages = [
  "relief_contracts",
  "ml",
  "ml.simulator",
  "ml.datasets",
  "ml.relieffm",
  "ml.training",
  "ml.calibration",
  "ml.baselines",
  "ml.evaluation",
  "services",
  "services.model_inference",
]

[tool.setuptools.package-dir]
relief_contracts = "packages/relief_contracts"
ml = "ml"
services = "services"

[tool.pytest.ini_options]
testpaths = ["tests", "packages/relief_contracts/tests"]
