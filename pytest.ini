[pytest]
# Multiple modules/*/tests/ directories legitimately share test file basenames
# (test_compute.py, test_engine.py, ...) since each is its own installed
# package. importlib mode keys modules by file path instead of a shared
# sys.modules name, so these don't collide the way rootdir mode would.
addopts = --import-mode=importlib
testpaths = modules apps/api apps/workflow_worker packages/relief_contracts/python
