[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relief-model-gateway"
version = "0.1.0"
description = "Relief Plan Two — the ReliefFM integration seam (Section 19/39). Plan-Two-owned; calls out to Plan One's services/model_inference, never the reverse."
requires-python = ">=3.9"
dependencies = ["relief-contracts", "relief-deterministic-forecast", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["relief_model_gateway"]
