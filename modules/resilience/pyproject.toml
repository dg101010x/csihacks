[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relief-resilience"
version = "0.1.0"
description = "Relief Plan Two — Financial Resilience Score calculation (Section 22)."
requires-python = ">=3.9"
dependencies = ["relief-contracts", "relief-deterministic-forecast", "relief-recurring-detection"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["relief_resilience"]
