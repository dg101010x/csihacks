[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relief-recurring-detection"
version = "0.1.0"
description = "Relief Plan Two — recurring pattern detection over ledger history (Section 36)."
requires-python = ">=3.9"
dependencies = ["relief-contracts"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["relief_recurring_detection"]
