[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relief-elasticity"
version = "0.1.0"
description = "Relief Plan Two — obligation elasticity (payment flexibility) modeling (Section 40)."
requires-python = ">=3.9"
dependencies = ["relief-contracts"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["relief_elasticity"]
