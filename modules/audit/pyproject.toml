[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relief-audit"
version = "0.1.0"
description = "Relief Plan Two — append-only audit trail and decision replay (Section 32.12/85)."
requires-python = ">=3.9"
dependencies = ["relief-contracts", "SQLAlchemy>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["relief_audit"]
