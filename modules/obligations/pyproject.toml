[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relief-obligations"
version = "0.1.0"
description = "Relief Plan Two — obligation classification and storage (Section 32.6, Section 36)."
requires-python = ">=3.9"
dependencies = ["relief-contracts", "relief-recurring-detection", "SQLAlchemy>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["relief_obligations"]
