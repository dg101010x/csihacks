[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relief-interventions"
version = "0.1.0"
description = "Relief Plan Two — intervention optimizer (Section 60-61)."
requires-python = ">=3.9"
dependencies = [
    "relief-contracts",
    "relief-deterministic-forecast",
    "relief-elasticity",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["relief_interventions"]
